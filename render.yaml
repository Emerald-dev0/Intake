# Apply to the existing API service; do not create a second frontend on Render.
services:
  - type: web
    name: intake-api
    runtime: node
    rootDir: apps/landing
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      # Set only after verifying the actual Render/Vercel forwarded-address chain; safe default is 0.
      - key: API_TRUST_PROXY_HOPS
        value: 0
