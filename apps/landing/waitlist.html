<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="Intake" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="description" content="%WAITLIST_DESCRIPTION%" />
    <meta name="theme-color" content="#0c0c0b" />
    <meta name="color-scheme" content="dark light" />
    <script>try{var t=localStorage.getItem('intake-theme');if(t!=='dark'&&t!=='light'){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#0c0c0b':'#f5f0e6')}catch(e){}</script>
    <title>%WAITLIST_TITLE%</title>
    <link rel="canonical" href="%SITE_URL%/waitlist" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Intake" />
    <meta property="og:title" content="%WAITLIST_TITLE%" />
    <meta property="og:description" content="%WAITLIST_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%/waitlist" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Intake’s illustrative Google Forms proposal, labeled “EXAMPLE - NOT APPLIED.”" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%WAITLIST_TITLE%" />
    <meta name="twitter:description" content="%WAITLIST_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
    <script type="application/ld+json">%WAITLIST_SCHEMA%</script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width:640px;margin:60px auto;padding:24px;font:18px/1.7 system-ui;color:#24231f">
        <a href="/">Intake</a>
        <h1>Less busywork. More possibility.</h1>
        <p>A simpler way to collect, organize, and work with information. Starting with AI-assisted forms. Built with you.</p>
        <p>Join the wait-list for early access and occasional product updates. Enable JavaScript to use the email form, or email <a href="mailto:daniel@intake.calder.click">daniel@intake.calder.click</a> and ask to join.</p>
        <p>No account or credit card needed. We don’t have a launch date to promise yet; we’ll email you when early access is ready.</p>
        <p><a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms</a></p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
