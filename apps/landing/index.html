<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="Intake" />
    <meta name="author" content="Oluwadare Daniel — Emerald" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="description" content="Describe the form you need in plain English. Intake shows you the questions, you change what you like, and the form is created in your own Google Forms account." />
    <meta name="theme-color" content="#0c0c0b" />
    <meta name="color-scheme" content="dark" />
    <title>%HOMEPAGE_TITLE%</title>
    <link rel="canonical" href="%SITE_URL%/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Intake" />
    <meta property="og:title" content="Intake — Google Forms, built from a sentence" />
    <meta property="og:description" content="Say what you want to collect. Review every question before it exists, confirm once it looks right, and it lands in your Google Forms account." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Intake showing a form proposal: a written request on the left, the questions it understood on the right." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Intake — Google Forms, built from a sentence" />
    <meta name="twitter:description" content="Say what you want to collect. Review every question before it exists, confirm once it looks right, and it lands in your Google Forms account." />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
    <meta name="twitter:image:alt" content="Intake showing a form proposal: a written request on the left, the questions it understood on the right." />

    <script id="intake-structured-data" type="application/ld+json">%STRUCTURED_DATA%</script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <style>
        body { margin: 0; background: #0c0c0b; color: #f1ece2; font: 16px/1.65 system-ui, sans-serif; }
        .seo-fallback { max-width: 860px; margin: 0 auto; padding: 32px 24px 64px; }
        .seo-fallback a { color: #ff7b47; }
        .seo-fallback h1, .seo-fallback h2 { line-height: 1.2; }
        .seo-fallback h1 { margin-top: 56px; font-size: clamp(2rem, 6vw, 3.5rem); }
        .seo-fallback section { padding: 22px 0; border-top: 1px solid #383832; }
        .seo-fallback li, .seo-fallback p { color: #d2cec4; }
        .seo-fallback footer { margin-top: 32px; color: #aaa69e; }
      </style>
      %NOSCRIPT_CONTENT%
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
